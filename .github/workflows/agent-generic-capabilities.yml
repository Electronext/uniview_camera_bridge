name: Finalize generic camera capability migration
on:
  push:
    branches: [agent/generic-camera-capabilities]
    paths: [.github/workflows/agent-generic-capabilities.yml]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/generic-camera-capabilities
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update docs and new-install defaults
        run: python tools/agent_docs_generic_ptz.py
      - name: Validate Python
        run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/uniview.py uniview_camera_bridge/ha_mqtt.py
      - name: Validate YAML parse
        run: |
          python -m pip install --quiet PyYAML
          python -c "import yaml; yaml.safe_load(open('uniview_camera_bridge/config.yaml')); print('config yaml ok')"
      - name: Commit
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git add uniview_camera_bridge/config.yaml uniview_camera_bridge/DOCS.md
          git commit -m "Document capability-driven PTZ discovery"
          git push
