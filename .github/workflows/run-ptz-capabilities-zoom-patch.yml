name: Run PTZ capability and zoom patch

on:
  push:
    branches:
      - feature/ptz-capabilities-and-front-zoom

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptz-capabilities-and-front-zoom
      - name: Apply patch
        run: python tools/patch_ptz_capabilities_zoom.py
      - name: Validate Python
        run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/ha_mqtt.py uniview_camera_bridge/uniview.py
      - name: Show diff
        run: git diff --check && git diff --stat && git diff
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uniview_camera_bridge/app.py uniview_camera_bridge/ha_mqtt.py uniview_camera_bridge/uniview.py uniview_camera_bridge/config.yaml uniview_camera_bridge/CHANGELOG.md
          git commit -m "Add PTZ capability probing and front zoom state" || exit 0
          git push
