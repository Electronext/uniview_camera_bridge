name: Run D2 ONVIF PTZ fix

on:
  push:
    branches: [fix/d2-onvif-ptz-diagnostics]
    paths:
      - .github/workflows/run-ptz-141-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d2-onvif-ptz-diagnostics
      - run: python tools/patch_ptz_141.py
      - run: python -m compileall -q uniview_camera_bridge
      - run: find uniview_camera_bridge -type d -name __pycache__ -prune -exec rm -rf {} +
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uniview_camera_bridge
          git commit -m "Fix D2 ONVIF proportional PTZ requests"
          git push origin fix/d2-onvif-ptz-diagnostics
