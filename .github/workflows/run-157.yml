name: Run bridge 1.5.7 patch
on:
  push:
    branches: [fix/d2-daynight-minimal-payload-1.5.7]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d2-daynight-minimal-payload-1.5.7
      - run: python tools/patch_157.py
      - run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/uniview.py uniview_camera_bridge/ha_mqtt.py
      - run: git diff --check && git diff --stat
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uniview_camera_bridge/uniview.py uniview_camera_bridge/app.py uniview_camera_bridge/config.yaml uniview_camera_bridge/CHANGELOG.md
          git commit -m "Use focused D2 day-night payload" || exit 0
          git push
