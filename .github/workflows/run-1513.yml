name: Run bridge 1.5.13 patch
on:
  push:
    branches: [feat/onvif-imaging-daynight-1.5.13]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/onvif-imaging-daynight-1.5.13
      - run: python -m py_compile tools/patch_1513.py
      - run: python tools/patch_1513.py
      - run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/uniview.py uniview_camera_bridge/ha_mqtt.py
      - run: git diff --check && git diff --stat
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uniview_camera_bridge/uniview.py uniview_camera_bridge/app.py uniview_camera_bridge/config.yaml uniview_camera_bridge/CHANGELOG.md
          git commit -m "Use ONVIF Imaging for dual-lens day/night" || exit 0
          git push
