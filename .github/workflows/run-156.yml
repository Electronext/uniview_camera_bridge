name: Run bridge 1.5.6 patch

on:
  push:
    branches:
      - fix/d2-image-control-migration-1.5.6

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/d2-image-control-migration-1.5.6
      - name: Apply patch
        run: python tools/patch_156.py
      - name: Validate Python
        run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/uniview.py uniview_camera_bridge/ha_mqtt.py
      - name: Show diff
        run: git diff --check && git diff --stat
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uniview_camera_bridge/app.py uniview_camera_bridge/config.yaml uniview_camera_bridge/CHANGELOG.md
          git commit -m "Migrate stale D2 image control channel" || exit 0
          git push
