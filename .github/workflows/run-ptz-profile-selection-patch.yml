name: Run PTZ profile selection patch

on:
  push:
    branches: [fix/onvif-ptz-profile-selection]
    paths:
      - .github/workflows/run-ptz-profile-selection-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onvif-ptz-profile-selection
      - run: python tools/patch_ptz_profile_selection.py
      - run: python -m py_compile uniview_camera_bridge/uniview.py uniview_camera_bridge/app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uniview_camera_bridge
          git commit -m "Select ONVIF PTZ-capable media profile"
          git push origin fix/onvif-ptz-profile-selection
