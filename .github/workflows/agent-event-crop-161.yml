name: Apply event crop 1.6.1 patch
on:
  push:
    branches: [agent/event-crop-1.6.1]
    paths:
      - tools/agent_event_crop_161.py
      - .github/workflows/agent-event-crop-161.yml
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[agent-crop-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/event-crop-1.6.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/agent_event_crop_161.py
      - run: python -m py_compile uniview_camera_bridge/alarm_service.py uniview_camera_bridge/app.py uniview_camera_bridge/ha_mqtt.py
      - run: rm -rf uniview_camera_bridge/__pycache__
      - run: rm -f tools/agent_event_crop_161.py .github/workflows/agent-event-crop-161.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Restore optional event crop thumbnails [agent-crop-done]'
          git push
