name: Run bridge 1.5.3 patch

on:
  push:
    branches:
      - feature/d2-illumination-controls-1.5.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/d2-illumination-controls-1.5.3
      - name: Apply patch
        run: python tools/patch_153.py
      - name: Validate Python
        run: python -m py_compile uniview_camera_bridge/app.py uniview_camera_bridge/uniview.py uniview_camera_bridge/ha_mqtt.py
      - name: Validate YAML
        run: python - <<'PY'
          import yaml
          yaml.safe_load(open('uniview_camera_bridge/config.yaml', encoding='utf-8'))
          PY
      - name: Show diff
        run: git diff --check && git diff --stat && git diff
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uniview_camera_bridge/app.py uniview_camera_bridge/config.yaml uniview_camera_bridge/ha_mqtt.py uniview_camera_bridge/uniview.py uniview_camera_bridge/CHANGELOG.md
          git commit -m "Add D2 native image and illumination controls" || exit 0
          git push
