name: Sync beta runtime version
on:
  push:
    branches: [main]
    paths: [.github/workflows/agent-sync-beta-version.yml]
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync runtime version
        run: |
          sed -i 's/1\.7\.0-alpha/1.7.0-beta1/g' uniview_camera_bridge/app.py
          python -m py_compile uniview_camera_bridge/app.py
      - name: Commit
        run: |
          git config user.name D3XT3R
          git config user.email d3xt3rsl4b@gmail.com
          git add uniview_camera_bridge/app.py
          git commit -m "Sync 1.7.0-beta1 runtime version"
          git push
