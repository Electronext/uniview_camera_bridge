name: Fix D2 PTZ patch workflow

on:
  push:
    branches: [feature/d2-proportional-ptz]
    paths:
      - .github/workflows/fix-d2-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/d2-proportional-ptz
      - name: Fix quoting
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/apply-d2-ptz.yml')
          s = p.read_text()
          s = s.replace("          append = '''\\n\\n    def continuous_move(", '          append = """\\n\\n    def continuous_move(', 1)
          s = s.replace("\\n'''\\n          if '    def continuous_move(' not in s:", "\\n\"\"\"\\n          if '    def continuous_move(' not in s:", 1)
          p.write_text(s)
          Path('.github/workflows/fix-d2-workflow.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix D2 PTZ patch workflow quoting"
          git push origin feature/d2-proportional-ptz
