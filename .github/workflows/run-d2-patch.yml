name: Run D2 PTZ patch

on:
  push:
    branches: [feature/d2-proportional-ptz]
    paths:
      - .github/workflows/run-d2-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/d2-proportional-ptz
      - name: Apply patch
        run: python tools/apply_d2_ptz_patch.py
      - name: Validate Python
        run: python -m compileall -q uniview_camera_bridge
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows tools/apply_d2_ptz_patch.py
          git commit -m "Add D2 proportional PTZ and rename camera bridge"
          git push origin feature/d2-proportional-ptz
